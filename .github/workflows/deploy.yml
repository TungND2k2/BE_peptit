name: deploy

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  ci:
    uses: PEARL-GLOBAL-VIETNAM/pearl-devops-dev/.github/workflows/app-build.yml@main
    permissions:
      contents: write
      packages: write
    with:
      app: peptit-api
      gitops-app: peptit
      context: .
      dockerfile: Dockerfile
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
